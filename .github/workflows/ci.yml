name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: angelic_booking
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/angelic_booking
      DATABASE_URL: postgres://angelic_app:angelic_app_dev@localhost:5432/angelic_booking
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      JOBS_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create app role and migrate
        run: |
          psql "$DATABASE_ADMIN_URL" -f packages/db/sql/roles.sql
          pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build web
        run: pnpm --filter @angelic/web build
      - name: Install Playwright
        run: pnpm --filter @angelic/web exec playwright install --with-deps chromium
      - name: E2E smoke
        run: pnpm --filter @angelic/web e2e
